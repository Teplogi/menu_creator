# Render Blueprint — https://render.com/docs/blueprint-spec
# 使い方: Render で「New +」→「Blueprint」→ このリポジトリ(Teplogi/menu_creator)を選択。
# 秘密情報（sync:false）は値をここに書かず、初回デプロイ時にダッシュボードで入力します。
services:
  - type: web
    name: menuraku
    runtime: node
    region: singapore          # Neon と同じシンガポールに合わせて低レイテンシに
    plan: starter              # Starter($7/月)＝常時起動（スリープなし）。0.5 CPU / 512 MB。
                               # ※有効化には Render に支払い方法(カード)の登録が必要。無料に戻すなら plan: free。
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true           # main への push で自動再デプロイ
    envVars:
      # --- 秘密情報: 初回にダッシュボードで入力（コミットしない） ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET   # ★本番用。ダッシュボードのWebhookで発行される whsec（ローカルの stripe listen とは別物）
        sync: false
      - key: APP_BASE_URL            # 例: https://menuraku.onrender.com（初回デプロイでURL確定後に設定）
        sync: false
      - key: VAPID_PUBLIC_KEY        # ★プッシュ通知用。ローカルの .env と同じ値をダッシュボードで入力
        sync: false
      - key: VAPID_PRIVATE_KEY       # ★秘密。.env と同じ値を入力（外部に出さない）
        sync: false
      - key: VAPID_SUBJECT           # 例: mailto:peitullysblack@gmail.com
        sync: false
      # --- Googleログイン: クライアントIDは非秘密なので値を直書き（クライアントに埋め込む公開情報） ---
      - key: GOOGLE_CLIENT_ID
        value: "654211998942-jgahkneb1no0ucj19g1p4b8utl55cu3s.apps.googleusercontent.com"
      # --- 非秘密: 既定値 ---
      # ★テスト期間モード。課金導線を止めて全機能を開放する。
      #   Stripeがテストキーのままだと、押した人をテスト決済画面に飛ばしてしまい
      #   不信を招くので、外部テスターに配る間は必ず "1" のままにする。
      #   ★Stripe の本番キー・本番Webhook・本番の価格IDを入れ終えてから "0" へ。
      - key: TEST_MODE
        value: "1"             # 本番キー設定後に "0"
      # 無料枠（本番）。週1回・3品の献立なら無料で回せる量。まとめて作る人に課金してもらう設計。
      - key: FREE_AI_MEALS_PER_MONTH
        value: "20"
      - key: FREE_AI_EDITS_PER_MONTH
        value: "10"            # AI修正の無料枠（別枠）
      # 新規登録は Google のみ（パスワード再設定に未対応のため）。"1" にするとパスワード登録も開く。
      # 既存のパスワード利用者のログインには影響しない。
      - key: PASSWORD_SIGNUP
        value: "0"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: NODE_VERSION
        value: "22"
